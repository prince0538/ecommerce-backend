paths:
  /api/v1/product:
    get:
      summary: Get all products (public, no login required)
      description: Returns every product, newest first. Prices are whole numbers in kobo, so 2500000 means ₦25,000.
      tags: [product]
      parameters:
        - name: search
          in: query
          required: false
          description: Search text. Every word must appear in the product name, in any order, ignoring capital letters.
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          description: Show only products in this category
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: 'Products retrieved successfully' }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string, example: 'Classic Sneakers' }
                        description: { type: string, nullable: true, example: 'Comfortable everyday sneakers' }
                        price: { type: integer, description: Price in kobo, example: 2500000 }
                        stock: { type: integer, example: 30 }
                        imageUrl: { type: string, example: 'https://res.cloudinary.com/demo/image/upload/sneakers.jpg' }
                        categoryId: { type: string, format: uuid }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                        category:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string, example: 'Shoes' }
        '400':
          description: Invalid query parameters
        '500':
          description: Something went wrong
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: 'Something went wrong' }
    post:
      summary: Create a new product (Admin only)
      description: Sent as multipart/form-data. The image is uploaded to Cloudinary and its link is saved as imageUrl.
      tags: [product]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - price
                - categoryId
                - imageUrl
              properties:
                name:
                  type: string
                  example: iPhone 15
                description:
                  type: string
                  example: Latest Apple smartphone
                price:
                  type: integer
                  description: Price as a whole number in kobo
                  example: 150000
                stock:
                  type: integer
                  minimum: 0
                  example: 10
                categoryId:
                  type: string
                  format: uuid
                imageUrl:
                  type: string
                  format: binary
                  description: Product image file
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: 'Product created successfully' }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string, example: 'iPhone 15' }
                      description: { type: string, nullable: true, example: 'Latest Apple smartphone' }
                      price: { type: integer, description: Price in kobo, example: 150000 }
                      stock: { type: integer, example: 10 }
                      imageUrl: { type: string, example: 'https://res.cloudinary.com/demo/image/upload/iphone.jpg' }
                      categoryId: { type: string, format: uuid }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
        '400':
          description: Image missing, required fields missing, or price or stock is not a whole number
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: 'image is required' }
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin only)
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: 'Category not found' }
        '500':
          description: Something went wrong

  /api/v1/product/{id}:
    get:
      summary: Get product by ID (public, no login required)
      tags: [product]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: 'Product retrieved successfully' }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string, example: 'Classic Sneakers' }
                      description: { type: string, nullable: true, example: 'Comfortable everyday sneakers' }
                      price: { type: integer, description: Price in kobo, example: 2500000 }
                      stock: { type: integer, example: 30 }
                      imageUrl: { type: string, example: 'https://res.cloudinary.com/demo/image/upload/sneakers.jpg' }
                      categoryId: { type: string, format: uuid }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
                      category:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          name: { type: string, example: 'Shoes' }
        '400':
          description: Invalid product id
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: 'Product not found' }
        '500':
          description: Something went wrong
    put:
      summary: Update product by ID (Admin only)
      description: Send only the fields you want to change.
      tags: [product]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: iPhone 15 Pro
                description:
                  type: string
                  example: Updated description
                price:
                  type: integer
                  description: Price as a whole number in kobo
                  example: 180000
                stock:
                  type: integer
                  minimum: 0
                  example: 20
                categoryId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: 'Product updated successfully' }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string, example: 'iPhone 15 Pro' }
                      description: { type: string, nullable: true, example: 'Updated description' }
                      price: { type: integer, description: Price in kobo, example: 180000 }
                      stock: { type: integer, example: 20 }
                      imageUrl: { type: string, example: 'https://res.cloudinary.com/demo/image/upload/iphone.jpg' }
                      categoryId: { type: string, format: uuid }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
        '400':
          description: Validation error or invalid id
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin only)
        '404':
          description: Product not found, or the category does not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: 'Product not found' }
        '500':
          description: Something went wrong
    delete:
      summary: Delete product by ID (Admin only)
      description: A product that has been ordered cannot be deleted. Deleting removes it from every cart.
      tags: [product]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: 'Product deleted successfully' }
        '400':
          description: Invalid product id, or the product has been ordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: 'Cannot delete product that has been ordered' }
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin only)
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: 'Product not found' }
        '500':
          description: Something went wrong
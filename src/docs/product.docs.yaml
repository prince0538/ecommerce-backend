paths:
  /api/v1/product:
    get:
      summary: Get all products (public, no login required)
      description: Returns every product, newest first. Prices are whole numbers in kobo, so 2500000 means ₦25,000.
      tags: [product]
      parameters:
        - name: search
          in: query
          required: false
          description: Search text. Every word must appear in the product name, in any order, ignoring capital letters.
          schema:
            type: string
            example: blue sneakers
        - name: categoryId
          in: query
          required: false
          description: Show only products in this category
          schema:
            type: string
            format: uuid
            example: 8dbc486d-663f-4515-8314-4553856238ec
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Products retrieved successfully
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                          example: Classic Sneakers - Blue
                        description:
                          type: string
                          example: Comfortable everyday sneakers (Blue)
                        price:
                          type: integer
                          description: Price in kobo
                          example: 2500000
                        stock:
                          type: integer
                          example: 30
                        imageUrl:
                          type: string
                          example: https://picsum.photos/seed/sneakers/600/600
                        categoryId:
                          type: string
                          format: uuid
                        category:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                              example: Shoes
        '400':
          description: Invalid query parameters
        '500':
          description: Something went wrong
    post:
      summary: Create a new product (Admin only)
      tags: [product]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - price
                - categoryId
                - imageUrl
              properties:
                name:
                  type: string
                  example: iPhone 15
                description:
                  type: string
                  example: Latest Apple smartphone
                price:
                  type: integer
                  description: Price as a whole number in kobo
                  example: 150000
                stock:
                  type: integer
                  minimum: 0
                  example: 10
                categoryId:
                  type: string
                  format: uuid
                  example: 8dbc486d-663f-4515-8314-4553856238ec
                imageUrl:
                  type: string
                  format: binary
                  description: Product image file
      responses:
        '201':
          description: Product created successfully
        '400':
          description: Validation error, image missing, or category does not exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin only)
        '500':
          description: Something went wrong

  /api/v1/product/{id}:
    get:
      summary: Get product by ID (public, no login required)
      tags: [product]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 8dbc486d-663f-4515-8314-4553856238ec
      responses:
        '200':
          description: Product retrieved successfully
        '400':
          description: Invalid product id
        '404':
          description: Product not found
        '500':
          description: Something went wrong
    put:
      summary: Update product by ID (Admin only)
      description: Send only the fields you want to change. At least one field is required.
      tags: [product]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 8dbc486d-663f-4515-8314-4553856238ec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: iPhone 15 Pro
                description:
                  type: string
                  example: Updated description
                price:
                  type: integer
                  description: Price as a whole number in kobo
                  example: 180000
                stock:
                  type: integer
                  minimum: 0
                  example: 20
                categoryId:
                  type: string
                  format: uuid
                  example: 8dbc486d-663f-4515-8314-4553856238ec
      responses:
        '200':
          description: Product updated successfully
        '400':
          description: Validation error, invalid id, or category does not exist
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin only)
        '404':
          description: Product not found
        '500':
          description: Something went wrong
    delete:
      summary: Delete product by ID (Admin only)
      tags: [product]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 8dbc486d-663f-4515-8314-4553856238ec
      responses:
        '204':
          description: Product deleted successfully
        '400':
          description: Invalid product id
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin only)
        '404':
          description: Product not found
        '409':
          description: Product is part of an order and cannot be deleted
        '500':
          description: Something went wrong
paths:
  /api/v1/order:
    post:
      summary: Checkout and create an order from the current cart (User only)
      tags: [order]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phone, address, state, lga, paymentMethod]
              properties:
                fullName: { type: string, example: Prince Udoigwe }
                phone: { type: string, example: '+2348012345678' }
                address: { type: string, example: '12 Example Street' }
                state: { type: string, example: Lagos }
                lga: { type: string, example: Ikeja }
                paymentMethod:
                  type: string
                  enum: [CARD, BANK_TRANSFER, CASH_ON_DELIVERY]
                  example: CARD
      responses:
        '201':
          description: Order created successfully
        '400':
          description: Cart is empty or there is not enough stock for a product
        '401':
          description: Unauthorized
        '500':
          description: Something went wrong
    get:
      summary: Get the authenticated user's orders
      tags: [order]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders retrieved successfully
        '401':
          description: Unauthorized
        '500':
          description: Something went wrong

  /api/v1/order/admin/all:
    get:
      summary: Get all orders from all users (Admin only)
      tags: [order]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders retrieved successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin only)
        '500':
          description: Something went wrong

  /api/v1/order/verify-payment/{reference}:
    get:
      summary: Verify a Paystack payment
      description: The reference is generated when payment is initialized and has the format order-uuid-timestamp.
      tags: [order]
      security:
        - bearerAuth: []
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
            maxLength: 120
          example: 8dbc486d-663f-4515-8314-4553856238ec-1730000000000
      responses:
        '200':
          description: Payment verification completed
        '400':
          description: Invalid payment reference
        '401':
          description: Unauthorized
        '404':
          description: Payment not found
        '500':
          description: Something went wrong

  /api/v1/order/{id}:
    get:
      summary: Get an order by ID (owner or Admin)
      tags: [order]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 8dbc486d-663f-4515-8314-4553856238ec
      responses:
        '200':
          description: Order retrieved successfully
        '400':
          description: Invalid order ID
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '500':
          description: Something went wrong

  /api/v1/order/{id}/pay:
    post:
      summary: Initialize payment for an order (Order owner only)
      tags: [order]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 8dbc486d-663f-4515-8314-4553856238ec
      responses:
        '200':
          description: Payment initialized successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizationUrl: { type: string, format: uri }
                  reference:
                    type: string
                    example: 8dbc486d-663f-4515-8314-4553856238ec-1730000000000
        '400':
          description: The order is cancelled, already paid, or is cash on delivery
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '500':
          description: Something went wrong

  /api/v1/order/{id}/status:
    put:
      summary: Update order status (Admin only)
      tags: [order]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 8dbc486d-663f-4515-8314-4553856238ec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PAID, SHIPPED, PENDING, CANCELLED, DELIVERED]
                  example: SHIPPED
      responses:
        '200':
          description: Order status updated successfully
        '400':
          description: Invalid order ID or status
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin only)
        '404':
          description: Order not found
        '500':
          description: Something went wrong

  /api/v1/order/{id}/payment-status:
    put:
      summary: Update payment status (Admin only)
      tags: [order]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 8dbc486d-663f-4515-8314-4553856238ec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentStatus]
              properties:
                paymentStatus:
                  type: string
                  enum: [PAID, FAILED, REFUNDED]
                  example: PAID
      responses:
        '200':
          description: Payment status updated successfully
        '400':
          description: Invalid payment status, cancelled order cannot be marked as paid, or only a paid order can be refunded
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin only)
        '404':
          description: Order not found
        '500':
          description: Something went wrong

  /api/v1/order/{id}/cancel:
    post:
      summary: Cancel a pending order (owner or Admin)
      tags: [order]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 8dbc486d-663f-4515-8314-4553856238ec
      responses:
        '200':
          description: Order cancelled successfully
        '400':
          description: Invalid order ID or only pending orders can be cancelled
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '500':
          description: Something went wrong

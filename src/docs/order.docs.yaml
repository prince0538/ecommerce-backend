paths:
  /api/v1/order:
    post:
      summary: Checkout - create an order from the current cart
      tags: [order]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Checkout successful
        '400':
          description: Cart is empty or not enough stock for a product
        '401':
          description: Unauthorized
        '500':
          description: Something went wrong
    get:
      summary: Get my orders
      tags: [order]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders retrieved successfully
        '401':
          description: Unauthorized
        '500':
          description: Something went wrong

  /api/v1/order/admin/all:
    get:
      summary: Get all orders from all users (Admin only)
      tags: [order]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders retrieved successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin only)
        '500':
          description: Something went wrong

  /api/v1/order/{id}:
    get:
      summary: Get order by ID (owner or Admin)
      tags: [order]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 8dbc486d-663f-4515-8314-4553856238ec
      responses:
        '200':
          description: Order retrieved successfully
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '500':
          description: Something went wrong

  /api/v1/order/{id}/status:
    put:
      summary: Update order status (Admin only)
      tags: [order]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 8dbc486d-663f-4515-8314-4553856238ec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  example: SHIPPED
      responses:
        '200':
          description: Order status updated successfully
        '400':
          description: Invalid status
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin only)
        '404':
          description: Order not found
        '500':
          description: Something went wrong

  /api/v1/order/{id}/cancel:
    post:
      summary: Cancel a pending order (owner or Admin)
      tags: [order]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 8dbc486d-663f-4515-8314-4553856238ec
      responses:
        '200':
          description: Order cancelled successfully
        '400':
          description: Only pending orders can be cancelled
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '500':
          description: Something went wrong